<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>STRATUM 3D</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        :root { 
            --accent: #00f2ff; 
            --glass: rgba(10, 10, 10, 0.8); 
            --border: rgba(255, 255, 255, 0.1); 
        }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; color: white; font-family: -apple-system, system-ui; overflow: hidden; }

        /* --- LOGO: TIGHT ISOMETRIC STACK --- */
        #splash {
            position: fixed; inset: 0; background: #000; z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.6s ease;
        }
        .logo-container { width: 130px; }
        .s-layer { 
            fill: none; stroke: var(--accent); stroke-width: 2.2; opacity: 0;
            filter: drop-shadow(0 0 8px rgba(0, 242, 255, 0.4));
            transition: all 0.7s cubic-bezier(0.19, 1, 0.22, 1);
        }
        .anim .l-bottom { opacity: 0.3; transform: translateY(14px); transition-delay: 0.1s; }
        .anim .l-mid { opacity: 0.6; transform: translateY(7px); transition-delay: 0.4s; }
        .anim .l-top { opacity: 1; transform: translateY(0px); transition-delay: 0.8s; }
        .loading-text { letter-spacing: 4px; font-size: 9px; color: var(--accent); font-weight: 300; margin-top: 20px; }

        /* --- LAYOUT FIX --- */
        header { height: 8vh; display: flex; align-items: center; justify-content: space-between; padding: 0 6vw; position: relative; z-index: 100; }
        .logo-txt { font-weight: 900; font-size: 22px; letter-spacing: -0.5px; }
        .import-btn { background: var(--glass); border: 1px solid var(--border); border-top: 1px solid rgba(255,255,255,0.2); color: var(--accent); font-size: 10px; font-weight: 800; padding: 8px 16px; border-radius: 10px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }

        #carousel { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; height: 78vh; width: 100vw; -webkit-overflow-scrolling: touch; }
        #carousel::-webkit-scrollbar { display: none; }
        .card-scene { min-width: 100vw; height: 100%; display: flex; align-items: center; justify-content: center; scroll-snap-align: center; scroll-snap-stop: always; }
        
        .main-card { 
            width: 90vw; height: 72vh; background: #080808; border-radius: 38px; 
            border: 1px solid var(--border); overflow: hidden; position: relative;
        }

        /* --- THE GRADUAL BLUE FALL-OFF & GLOWING BUTTON --- */
        .vignette-bottom {
            position: absolute; bottom: 0; width: 100%; height: 45%;
            background: linear-gradient(to top, 
                rgba(0, 10, 15, 1) 0%, 
                rgba(0, 40, 50, 0.4) 40%, 
                transparent 100%
            );
            backdrop-filter: blur(var(--blur-amount, 0px));
            mask-image: linear-gradient(to top, rgba(0,0,0,1) 0%, rgba(0,0,0,0.5) 50%, transparent 100%);
            -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,1) 0%, rgba(0,0,0,0.5) 50%, transparent 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
            padding-bottom: 3vh;
            pointer-events: none;
        }

        .blur-layer {
            position: absolute; inset: 0;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            mask-image: linear-gradient(to top, black 0%, transparent 60%);
            -webkit-mask-image: linear-gradient(to top, black 0%, transparent 60%);
        }

        .vis-pill { 
            width: 82%; background: rgba(25, 25, 25, 0.5); border: 1px solid var(--border); 
            border-top: 1px solid rgba(255,255,255,0.2); padding: 18px; border-radius: 50px; 
            color: white; font-size: 11px; font-weight: 700; letter-spacing: 1px; text-align: center;
            pointer-events: auto; backdrop-filter: blur(5px);
            /* Define the glow transition */
            transition: all 0.15s ease-out, box-shadow 0.1s ease-out;
        }

        /* --- THE GLOW EFFECT WHEN PRESSED --- */
        .vis-pill:active { 
            background: rgba(0, 242, 255, 0.6); /* Translucent Stratum color */
            border-color: var(--accent);
            color: #000; /* Black text for contrast */
            /* Neon Box-Shadow Glow */
            box-shadow: 0 0 20px 5px rgba(0, 242, 255, 0.7), 0 0 40px 10px rgba(0, 242, 255, 0.4);
            transform: scale(0.97); /* Subtle press-down scale */
        }

        /* --- PAGINATION --- */
        .pagi-wrap { height: 10vh; display: flex; align-items: center; justify-content: center; }
        .dot { width: 6px; height: 6px; background: rgba(255,255,255,0.15); border-radius: 50%; transition: 0.4s; margin: 0 4px; }
        .dot.active { width: 22px; background: var(--accent); border-radius: 10px; }
    </style>
</head>
<body>

    <div id="splash">
        <div class="logo-container" id="logo-box">
            <svg viewBox="0 0 100 110">
                <path class="s-layer l-bottom" d="M25 70 L50 82 L75 70 L50 58 Z M25 70 L25 74 L50 86 L75 74 L75 70" />
                <path class="s-layer l-mid" d="M25 50 L50 62 L75 50 L50 38 Z M25 50 L25 54 L50 66 L75 54 L75 50" />
                <path class="s-layer l-top" d="M25 30 L50 42 L75 30 L50 18 Z M25 30 L25 34 L50 46 L75 34 L75 30" />
            </svg>
        </div>
        <div class="loading-text">INITIALISING STRATUM3D</div>
    </div>

    <header>
        <div class="logo-txt">STRATUM3D</div>
        <label class="import-btn">IMPORT<input type="file" id="file-in" multiple style="display: none;"></label>
    </header>

    <div id="carousel">
        <div class="card-scene">
            <div class="main-card" style="display:flex; align-items:center; justify-content:center; color:#444; font-size: 11px; letter-spacing: 1.5px; text-align:center;">
                DROP .GLB / .GLTF<br>TO START VISUALISING
            </div>
        </div>
    </div>

    <div class="pagi-wrap">
        <div id="pagi" style="display:flex;"></div>
    </div>

    <script>
        const carousel = document.getElementById('carousel');
        const pagi = document.getElementById('pagi');
        const logoBox = document.getElementById('logo-box');

        window.onload = () => {
            logoBox.classList.add('anim');
            setTimeout(() => {
                document.getElementById('splash').style.opacity = '0';
                setTimeout(() => document.getElementById('splash').remove(), 600);
            }, 3000);
        };

        document.getElementById('file-in').addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            carousel.innerHTML = ''; pagi.innerHTML = '';
            files.forEach((file, i) => {
                const url = URL.createObjectURL(file);
                const name = file.name.split('.')[0].toUpperCase();
                const scene = document.createElement('div');
                scene.className = 'card-scene';
                scene.innerHTML = `<div class="main-card">
                    <model-viewer src="${url}" ar camera-controls touch-action="pan-y" interaction-prompt="none"></model-viewer>
                    <div class="vignette-bottom">
                        <div class="blur-layer"></div>
                        <div class="vis-pill" onclick="this.parentElement.previousElementSibling.activateAR()">VISUALISE ${name}</div>
                    </div>
                </div>`;
                carousel.appendChild(scene);
                const dot = document.createElement('div');
                dot.className = `dot ${i === 0 ? 'active' : ''}`;
                pagi.appendChild(dot);
            });
        });

        carousel.addEventListener('scroll', () => {
            const index = Math.round(carousel.scrollLeft / window.innerWidth);
            document.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('active', i === index));
        });
    </script>
</body>
</html>
