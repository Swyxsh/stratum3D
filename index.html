<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>STRATUM 3D</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        :root { 
            --system-blue: #00f2ff; /* Your signature hex value */
            --glass-cyan: rgba(0, 242, 255, 0.15);
            --system-bg: #000000;
        }
        
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--system-bg); color: white; font-family: -apple-system, sans-serif; overflow: hidden; }

        /* LOADING SCREEN FIX */
        #splash-screen {
            position: fixed; inset: 0; background: #000; z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.8s ease;
        }

        /* COLORED GLASS LOGO ANIMATION */
        .logo-box { width: 160px; height: 160px; position: relative; }
        .stratum-3d-layer { 
            opacity: 0; 
            transform: translateY(-60px); 
            fill: var(--glass-cyan); /* Glass effect */
            stroke: var(--system-blue); 
            stroke-width: 1.5;
            transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
        }
        
        /* Sequence: Bottom, Mid, Top */
        .animate .layer-bottom { opacity: 1; transform: translateY(0); transition-delay: 0.5s; }
        .animate .layer-mid { opacity: 1; transform: translateY(0); transition-delay: 1.0s; }
        .animate .layer-top { opacity: 1; transform: translateY(0); transition-delay: 1.5s; }
        
        .loading-text { 
            font-size: 10px; text-transform: uppercase; letter-spacing: 5px; 
            color: var(--system-blue); margin-top: 30px; 
        }

        /* HEADER & IMPORT BUTTON FIX */
        header { 
            height: 70px; display: flex; align-items: center; justify-content: space-between; 
            padding: 0 24px; background: rgba(0,0,0,0.8); backdrop-filter: blur(20px); z-index: 1000;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .logo-text { font-weight: 900; font-size: 20px; letter-spacing: -1px; }

        /* Functional Import Label */
        .import-btn {
            color: var(--system-blue); font-size: 11px; font-weight: 800;
            border: 1px solid var(--system-blue); padding: 8px 16px;
            border-radius: 8px; cursor: pointer; display: inline-block;
        }

        /* CAROUSEL */
        #carousel { 
            display: flex; overflow-x: auto; scroll-snap-type: x mandatory; 
            width: 100vw; height: calc(100vh - 70px); scroll-behavior: smooth;
        }
        .model-card { min-width: 100vw; height: 100%; scroll-snap-align: start; display: flex; align-items: center; justify-content: center; }
        
        .viewer-container { 
            width: 85%; height: 65%; background: rgba(255,255,255,0.03); 
            border-radius: 30px; border: 1px solid rgba(255,255,255,0.1); 
            overflow: hidden; position: relative;
        }

        model-viewer { width: 100%; height: 100%; outline: none; }
    </style>
</head>
<body>

    <div id="splash-screen">
        <div class="logo-box animate">
            <svg viewBox="0 0 100 100">
                <path class="stratum-3d-layer layer-bottom" d="M20 75 L50 88 L80 75 L50 62 Z M20 75 L20 80 L50 93 L80 80 L80 75" />
                <path class="stratum-3d-layer layer-mid" d="M20 52 L50 65 L80 52 L50 39 Z M20 52 L20 57 L50 70 L80 57 L80 52" />
                <path class="stratum-3d-layer layer-top" d="M20 29 L50 42 L80 29 L50 16 Z M20 29 L20 34 L50 47 L80 34 L80 29" />
            </svg>
        </div>
        <div class="loading-text">Loading STRATUM 3D</div>
    </div>

    <header>
        <span class="logo-text">STRATUM3D</span>
        <label class="import-btn">
            IMPORT FILE
            <input type="file" id="file-input" multiple style="display: none;">
        </label>
    </header>

    <div id="carousel">
        <div class="model-card"><p style="opacity:0.3">Upload .glb or .gltf files</p></div>
    </div>

    <script>
        const splash = document.getElementById('splash-screen');
        const fileInput = document.getElementById('file-input');
        const carousel = document.getElementById('carousel');

        // Auto-remove splash screen after animation completes
        window.addEventListener('load', () => {
            setTimeout(() => {
                splash.style.opacity = '0';
                setTimeout(() => splash.remove(), 800);
            }, 3500);
        });

        fileInput.addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            if (files.length === 0) return;
            
            carousel.innerHTML = '';
            files.forEach((file) => {
                const url = URL.createObjectURL(file);
                const card = document.createElement('div');
                card.className = 'model-card';
                card.innerHTML = `
                    <div class="viewer-container">
                        <model-viewer src="${url}" ar camera-controls touch-action="pan-y"></model-viewer>
                    </div>`;
                carousel.appendChild(card);
            });
        });
    </script>
</body>
</html>
