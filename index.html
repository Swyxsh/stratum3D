<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>STRATUM 3D</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        :root { 
            --accent: #00f2ff; 
            --glass: rgba(15, 15, 15, 0.85); 
            --border: rgba(255, 255, 255, 0.1); 
        }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; color: white; font-family: -apple-system, system-ui; overflow: hidden; }

        /* --- SPLASH SCREEN --- */
        #splash {
            position: fixed; inset: 0; background: #000; z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.6s ease;
        }
        .logo-container { width: 120px; }
        .s-layer { 
            fill: none; stroke: var(--accent); stroke-width: 2.5; opacity: 0;
            filter: drop-shadow(0 0 10px rgba(0, 242, 255, 0.5));
            transition: all 0.5s cubic-bezier(0.19, 1, 0.22, 1);
        }
        .anim .l-bottom { opacity: 0.3; transform: translateY(8px); transition-delay: 0.1s; }
        .anim .l-mid { opacity: 0.6; transform: translateY(4px); transition-delay: 0.3s; }
        .anim .l-top { opacity: 1; transform: translateY(0px); transition-delay: 0.5s; }
        .loading-text { letter-spacing: 3px; font-size: 10px; color: var(--accent); font-weight: 400; margin-top: 25px; text-transform: uppercase; }

        /* --- AR LOADING OVERLAY --- */
        #ar-loading {
            position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 10000;
            display: none; flex-direction: column; align-items: center; justify-content: center;
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
        }

        /* --- HEADER --- */
        header { height: 60px; display: flex; align-items: center; justify-content: space-between; padding: 0 25px; }
        .logo-txt { font-weight: 900; font-size: 24px; letter-spacing: -0.5px; }
        
        /* --- CAROUSEL & TALL CARD (FIXED HEIGHT) --- */
        #carousel { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; height: calc(100% - 140px); width: 100vw; -webkit-overflow-scrolling: touch; }
        #carousel::-webkit-scrollbar { display: none; }
        .card-scene { min-width: 100vw; height: 100%; display: flex; align-items: center; justify-content: center; scroll-snap-align: center; }
        
        .main-card { 
            width: 92%; 
            height: 82dvh; /* Updated to reach lower as per image_3.png */
            background: #0a0a0a; 
            border-radius: 40px; 
            border: 1px solid var(--border); 
            overflow: hidden; 
            position: relative;
        }
        model-viewer { width: 100%; height: 100%; background-color: transparent; }

        /* --- OVERLAY & BUTTON (FIXED GLOW & FONT) --- */
        .vignette-bottom {
            position: absolute; bottom: 0; width: 100%; height: 35%;
            background: linear-gradient(to top, rgba(0, 15, 20, 1) 0%, rgba(0, 40, 50, 0.2) 50%, transparent 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
            padding-bottom: 30px; pointer-events: none;
            backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px);
            mask-image: linear-gradient(to top, black 30%, transparent 100%);
            -webkit-mask-image: linear-gradient(to top, black 30%, transparent 100%);
        }

        .vis-pill { 
            width: 85%; background: rgba(30, 30, 30, 0.7); border: 1px solid var(--border); 
            border-top: 1px solid rgba(255,255,255,0.15); padding: 20px; border-radius: 50px; 
            color: white; 
            font-size: 9px; /* Smaller font as requested */
            font-weight: 700; letter-spacing: 1.5px; text-align: center;
            pointer-events: auto; backdrop-filter: blur(10px); transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            
            /* REMOVES MOBILE TAP HIGHLIGHT/GLOW */
            -webkit-tap-highlight-color: transparent;
            outline: none;
        }

        .vis-pill:active { 
            background: var(--accent); color: #000;
            box-shadow: 0 0 40px var(--accent), 0 0 10px rgba(255,255,255,0.5);
            transform: scale(0.95); border-color: white;
        }

        /* --- PAGINATION --- */
        .dots-container { height: 40px; display: flex; align-items: center; justify-content: center; }
        .dot { width: 6px; height: 6px; background: rgba(255,255,255,0.2); border-radius: 50%; transition: 0.4s; margin: 0 5px; }
        .dot.active { width: 24px; background: var(--accent); border-radius: 10px; }
    </style>
</head>
<body>

    <div id="splash">
        <div class="logo-container" id="logo-box">
            <svg viewBox="0 0 100 100">
                <path class="s-layer l-bottom" d="M15 65 L50 80 L85 65 L50 50 Z M35 65 L50 72 L65 65 L50 58 Z" />
                <path class="s-layer l-mid" d="M15 45 L50 60 L85 45 L50 30 Z M35 45 L50 52 L65 45 L50 38 Z" />
                <path class="s-layer l-top" d="M15 25 L50 40 L85 25 L50 10 Z M35 25 L50 32 L65 25 L50 18 Z" />
            </svg>
        </div>
        <div class="loading-text">Initialising Stratum</div>
    </div>

    <div id="ar-loading">
        <div class="logo-container">
            <svg viewBox="0 0 100 100">
                <path fill="none" stroke="#00f2ff" stroke-width="2.5" d="M15 65 L50 80 L85 65 L50 50 Z M35 65 L50 72 L65 65 L50 58 Z" style="opacity:0.3; transform:translateY(8px);"/>
                <path fill="none" stroke="#00f2ff" stroke-width="2.5" d="M15 45 L50 60 L85 45 L50 30 Z M35 45 L50 52 L65 45 L50 38 Z" style="opacity:0.6; transform:translateY(4px);"/>
                <path fill="none" stroke="#00f2ff" stroke-width="2.5" d="M15 25 L50 40 L85 25 L50 10 Z M35 25 L50 32 L65 25 L50 18 Z" style="opacity:1;"/>
            </svg>
        </div>
        <div class="loading-text">Visualising in AR</div>
    </div>

    <header>
        <div class="logo-txt">STRATUM3D</div>
        <label style="background:var(--glass); padding:10px 18px; border-radius:12px; font-size:11px; font-weight:700; border:1px solid var(--border); color:var(--accent);">
            IMPORT<input type="file" id="file-in" multiple style="display: none;">
        </label>
    </header>

    <div id="carousel">
        <div class="card-scene">
            <div class="main-card" style="display:flex; align-items:center; justify-content:center; color:#666; font-size: 11px; letter-spacing: 1px;">
                DROP .GLB MODELS HERE
            </div>
        </div>
    </div>

    <div class="dots-container">
        <div id="pagi" style="display:flex;"></div>
    </div>

    <script>
        const carousel = document.getElementById('carousel');
        const pagi = document.getElementById('pagi');
        const arOverlay = document.getElementById('ar-loading');

        window.onload = () => {
            document.getElementById('logo-box').classList.add('anim');
            setTimeout(() => {
                document.getElementById('splash').style.opacity = '0';
                setTimeout(() => document.getElementById('splash').remove(), 600);
            }, 2500);
        };

        function triggerAR(viewer) {
            arOverlay.style.display = 'flex';
            viewer.activateAR();
            setTimeout(() => { arOverlay.style.display = 'none'; }, 3500);
        }

        document.getElementById('file-in').addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            carousel.innerHTML = ''; pagi.innerHTML = '';
            files.forEach((file, i) => {
                const url = URL.createObjectURL(file);
                const name = file.name.split('.')[0].toUpperCase();
                const scene = document.createElement('div');
                scene.className = 'card-scene';
                scene.innerHTML = `<div class="main-card">
                    <model-viewer src="${url}" ar camera-controls touch-action="pan-y" shadow-intensity="1"></model-viewer>
                    <div class="vignette-bottom">
                        <div class="vis-pill" onclick="triggerAR(this.parentElement.previousElementSibling)">VISUALISE ${name}</div>
                    </div>
                </div>`;
                carousel.appendChild(scene);
                const dot = document.createElement('div');
                dot.className = `dot ${i === 0 ? 'active' : ''}`;
                pagi.appendChild(dot);
            });
        });

        carousel.addEventListener('scroll', () => {
            const index = Math.round(carousel.scrollLeft / window.innerWidth);
            document.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('active', i === index));
        });
    </script>
</body>
</html>
