<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>STRATUM 3D</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        :root { 
            --accent: #00f2ff;
            --glass: rgba(15, 15, 15, 0.85);
            --border: rgba(255, 255, 255, 0.1);
        }
        
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; color: white; font-family: -apple-system, system-ui; overflow: hidden; }

        /* --- LOADING SCREEN: TRUE ISOMETRIC STACK --- */
        #splash {
            position: fixed; inset: 0; background: #000; z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.8s ease;
        }

        .logo-container { width: 180px; position: relative; }
        .s-layer { 
            fill: none; stroke: var(--accent); stroke-width: 2; opacity: 0;
            filter: drop-shadow(0 0 12px rgba(0, 242, 255, 0.5));
            transition: all 0.9s cubic-bezier(0.19, 1, 0.22, 1);
            transform: translateY(100px) scale(0.8);
        }

        /* Sequential Build Logic: image_6.png style */
        .anim .l-bottom { opacity: 0.4; transform: translateY(40px) scale(1); transition-delay: 0.2s; }
        .anim .l-mid { opacity: 0.7; transform: translateY(20px) scale(1); transition-delay: 0.7s; }
        .anim .l-top { opacity: 1; transform: translateY(0px) scale(1); transition-delay: 1.2s; }

        /* --- HEADER --- */
        header { 
            height: 80px; display: flex; align-items: center; justify-content: space-between; 
            padding: 0 25px; position: absolute; top: 0; width: calc(100% - 50px); z-index: 100;
        }
        .logo-txt { font-weight: 800; font-size: 24px; letter-spacing: -1px; }
        .import-btn {
            background: var(--glass); border: 1px solid var(--border); border-top: 1px solid rgba(255,255,255,0.2);
            color: var(--accent); font-size: 10px; font-weight: 800; text-transform: uppercase;
            padding: 8px 18px; border-radius: 10px; backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
        }

        /* --- MAIN CARD: image_7.png SCALE --- */
        #carousel { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; height: 100vh; }
        #carousel::-webkit-scrollbar { display: none; }

        .card-scene { 
            min-width: 100vw; height: 100%; display: flex; align-items: center; justify-content: center; 
            padding-top: 40px;
        }
        
        .main-card { 
            width: 92%; height: 82%; background: #080808; border-radius: 45px; 
            border: 1px solid var(--border); overflow: hidden; position: relative;
            box-shadow: 0 40px 100px rgba(0,0,0,0.8);
        }

        model-viewer { width: 100%; height: 100%; --poster-color: transparent; }

        /* --- THE BLURRED FOOTER (image_5/7 style) --- */
        .glass-footer {
            position: absolute; bottom: 0; width: 100%; height: 140px;
            background: linear-gradient(to bottom, transparent, rgba(0,0,0,0.9) 70%);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        .vis-pill {
            width: 85%; background: rgba(25, 25, 25, 0.6);
            border: 1px solid var(--border); border-top: 1px solid rgba(255,255,255,0.15);
            padding: 18px; border-radius: 50px; color: white;
            font-size: 10px; font-weight: 700; letter-spacing: 1.5px;
            text-align: center; margin-bottom: 25px;
        }

        /* --- CARD COUNTER --- */
        .pagination {
            position: absolute; bottom: 30px; display: flex; gap: 8px;
        }
        .dot { width: 6px; height: 6px; background: rgba(255,255,255,0.2); border-radius: 50%; transition: 0.3s; }
        .dot.active { width: 25px; background: var(--accent); border-radius: 10px; }
    </style>
</head>
<body>

    <div id="splash">
        <div class="logo-container anim">
            <svg viewBox="0 0 100 120">
                <!-- Bottom Slab -->
                <path class="s-layer l-bottom" d="M20 80 L50 95 L80 80 L50 65 Z M20 80 L20 85 L50 100 L80 85 L80 80" />
                <!-- Middle Slab -->
                <path class="s-layer l-mid" d="M20 55 L50 70 L80 55 L50 40 Z M20 55 L20 60 L50 75 L80 60 L80 55" />
                <!-- Top Slab -->
                <path class="s-layer l-top" d="M20 30 L50 45 L80 30 L50 15 Z M20 30 L20 35 L50 50 L80 35 L80 30" />
            </svg>
        </div>
        <div style="margin-top:20px; letter-spacing:8px; font-size:10px; color:var(--accent)">INITIALISING</div>
    </div>

    <header>
        <div class="logo-txt">Stratum</div>
        <label class="import-btn">IMPORT<input type="file" id="file-in" multiple style="display: none;"></label>
    </header>

    <div id="carousel">
        <div class="card-scene">
            <div class="main-card" style="display:flex; align-items:center; justify-content:center; color:#333;">
                READY FOR .GLB FILES
            </div>
        </div>
    </div>

    <div class="pagination" id="pagi"></div>

    <script>
        const carousel = document.getElementById('carousel');
        const pagi = document.getElementById('pagi');

        window.onload = () => {
            setTimeout(() => {
                document.getElementById('splash').style.opacity = '0';
                setTimeout(() => document.getElementById('splash').remove(), 800);
            }, 3000);
        };

        document.getElementById('file-in').addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            carousel.innerHTML = '';
            pagi.innerHTML = '';

            files.forEach((file, i) => {
                const url = URL.createObjectURL(file);
                const name = file.name.split('.')[0].toUpperCase();
                
                const scene = document.createElement('div');
                scene.className = 'card-scene';
                scene.innerHTML = `
                    <div class="main-card">
                        <model-viewer src="${url}" ar camera-controls touch-action="pan-y"></model-viewer>
                        <div class="glass-footer">
                            <div class="vis-pill" onclick="this.parentElement.previousElementSibling.activateAR()">
                                VISUALISE ${name}
                            </div>
                        </div>
                    </div>`;
                carousel.appendChild(scene);

                const dot = document.createElement('div');
                dot.className = `dot ${i === 0 ? 'active' : ''}`;
                pagi.appendChild(dot);
            });
        });

        carousel.addEventListener('scroll', () => {
            const index = Math.round(carousel.scrollLeft / window.innerWidth);
            document.querySelectorAll('.dot').forEach((d, i) => {
                d.classList.toggle('active', i === index);
            });
        });
    </script>
</body>
</html>
