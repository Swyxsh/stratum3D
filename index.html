<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>STRATUM 3D</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        :root { 
            --accent: #00f2ff; 
            --glass: rgba(10, 10, 10, 0.8); 
            --border: rgba(255, 255, 255, 0.1); 
        }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; color: white; font-family: -apple-system, system-ui; overflow: hidden; }

        /* --- LOGO FIX: HOLLOW SQUARES & TIGHT STACK --- */
        #splash {
            position: fixed; inset: 0; background: #000; z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.6s ease;
        }
        .logo-container { width: 140px; }
        .s-layer { 
            fill: none; stroke: var(--accent); stroke-width: 2; opacity: 0;
            filter: drop-shadow(0 0 8px rgba(0, 242, 255, 0.4));
            transition: all 0.6s cubic-bezier(0.19, 1, 0.22, 1);
        }
        /* Tightened Y-transformations for that image_11 look */
        .anim .l-bottom { opacity: 0.3; transform: translateY(10px); transition-delay: 0.1s; }
        .anim .l-mid { opacity: 0.6; transform: translateY(5px); transition-delay: 0.3s; }
        .anim .l-top { opacity: 1; transform: translateY(0px); transition-delay: 0.5s; }
        .loading-text { letter-spacing: 4px; font-size: 9px; color: var(--accent); font-weight: 300; margin-top: 25px; text-transform: uppercase; }

        /* --- AR LOADING OVERLAY --- */
        #ar-loading {
            position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 10000;
            display: none; flex-direction: column; align-items: center; justify-content: center;
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
        }

        /* --- LAYOUT: CARD & DOTS --- */
        header { height: 8vh; display: flex; align-items: center; justify-content: space-between; padding: 0 6vw; position: relative; z-index: 100; }
        .logo-txt { font-weight: 900; font-size: 22px; letter-spacing: -0.5px; }
        
        #carousel { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; height: 82vh; width: 100vw; -webkit-overflow-scrolling: touch; }
        #carousel::-webkit-scrollbar { display: none; }
        .card-scene { min-width: 100vw; height: 100%; display: flex; align-items: center; justify-content: center; scroll-snap-align: center; scroll-snap-stop: always; }
        
        .main-card { 
            width: 90vw; height: 76vh; background: #080808; border-radius: 40px; 
            border: 1px solid var(--border); overflow: hidden; position: relative;
        }

        /* --- DISAPPEARING BOTTOM & BUTTON GLOW --- */
        .vignette-bottom {
            position: absolute; bottom: 0; width: 100%; height: 40%;
            background: linear-gradient(to top, rgba(0, 15, 20, 1) 0%, rgba(0, 40, 50, 0.3) 45%, transparent 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
            padding-bottom: 3.5vh; pointer-events: none;
            mask-image: linear-gradient(to top, black 20%, transparent 100%);
            -webkit-mask-image: linear-gradient(to top, black 20%, transparent 100%);
        }

        .vis-pill { 
            width: 80%; background: rgba(30, 30, 30, 0.6); border: 1px solid var(--border); 
            border-top: 1px solid rgba(255,255,255,0.2); padding: 18px; border-radius: 50px; 
            color: white; font-size: 11px; font-weight: 700; letter-spacing: 1.5px; text-align: center;
            pointer-events: auto; backdrop-filter: blur(10px); transition: 0.3s;
        }
        .vis-pill:active { 
            transform: scale(0.96); background: var(--accent); color: #000;
            box-shadow: 0 0 30px var(--accent);
        }

        /* --- PAGINATION (THE DOTS) --- */
        .dots-container { height: 10vh; display: flex; align-items: center; justify-content: center; position: absolute; bottom: 0; width: 100%; }
        .dot { width: 5px; height: 5px; background: rgba(255,255,255,0.15); border-radius: 50%; transition: 0.4s; margin: 0 4px; }
        .dot.active { width: 18px; background: var(--accent); border-radius: 10px; }
    </style>
</head>
<body>

    <!-- Splash Screen -->
    <div id="splash">
        <div class="logo-container" id="logo-box">
            <svg viewBox="0 0 100 110">
                <!-- Hollow Slabs (Paths create the center cut-out) -->
                <path class="s-layer l-bottom" d="M20 70 L50 85 L80 70 L50 55 Z M35 70 L50 78 L65 70 L50 62 Z" />
                <path class="s-layer l-mid" d="M20 50 L50 65 L80 50 L50 35 Z M35 50 L50 58 L65 50 L50 42 Z" />
                <path class="s-layer l-top" d="M20 30 L50 45 L80 30 L50 15 Z M35 30 L50 38 L65 30 L50 22 Z" />
            </svg>
        </div>
        <div class="loading-text">Initialising Stratum</div>
    </div>

    <!-- AR Loading State -->
    <div id="ar-loading">
        <div class="logo-container">
            <svg viewBox="0 0 100 110">
                <path class="s-layer l-bottom" style="opacity:1; transform:translateY(10px);" d="M20 70 L50 85 L80 70 L50 55 Z M35 70 L50 78 L65 70 L50 62 Z" />
                <path class="s-layer l-mid" style="opacity:1; transform:translateY(5px);" d="M20 50 L50 65 L80 50 L50 35 Z M35 50 L50 58 L65 50 L50 42 Z" />
                <path class="s-layer l-top" style="opacity:1; transform:translateY(0px);" d="M20 30 L50 45 L80 30 L50 15 Z M35 30 L50 38 L65 30 L50 22 Z" />
            </svg>
        </div>
        <div class="loading-text">Visualising in AR</div>
    </div>

    <header>
        <div class="logo-txt">STRATUM3D</div>
        <label style="background:var(--glass); padding:8px 16px; border-radius:10px; font-size:10px; border:1px solid var(--border); color:var(--accent);">
            IMPORT<input type="file" id="file-in" multiple style="display: none;">
        </label>
    </header>

    <div id="carousel">
        <div class="card-scene">
            <div class="main-card" style="display:flex; align-items:center; justify-content:center; color:#444; font-size: 11px; letter-spacing: 1.5px; text-align:center;">
                UPLOAD .GLB TO START
            </div>
        </div>
    </div>

    <div class="dots-container">
        <div id="pagi" style="display:flex;"></div>
    </div>

    <script>
        const carousel = document.getElementById('carousel');
        const pagi = document.getElementById('pagi');
        const arOverlay = document.getElementById('ar-loading');

        window.onload = () => {
            document.getElementById('logo-box').classList.add('anim');
            setTimeout(() => {
                document.getElementById('splash').style.opacity = '0';
                setTimeout(() => document.getElementById('splash').remove(), 600);
            }, 2500);
        };

        function startAR(modelViewer) {
            arOverlay.style.display = 'flex';
            modelViewer.activateAR();
            // Hide overlay after a few seconds or when returning
            setTimeout(() => { arOverlay.style.display = 'none'; }, 4000);
        }

        document.getElementById('file-in').addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            carousel.innerHTML = ''; pagi.innerHTML = '';
            files.forEach((file, i) => {
                const url = URL.createObjectURL(file);
                const name = file.name.split('.')[0].toUpperCase();
                const scene = document.createElement('div');
                scene.className = 'card-scene';
                scene.innerHTML = `<div class="main-card">
                    <model-viewer src="${url}" ar camera-controls touch-action="pan-y"></model-viewer>
                    <div class="vignette-bottom">
                        <div class="vis-pill" onclick="startAR(this.parentElement.previousElementSibling)">VISUALISE ${name}</div>
                    </div>
                </div>`;
                carousel.appendChild(scene);
                const dot = document.createElement('div');
                dot.className = `dot ${i === 0 ? 'active' : ''}`;
                pagi.appendChild(dot);
            });
        });

        carousel.addEventListener('scroll', () => {
            const index = Math.round(carousel.scrollLeft / window.innerWidth);
            document.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('active', i === index));
        });
    </script>
</body>
</html>
